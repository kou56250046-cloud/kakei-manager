<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>家計管理ダッシュボード</title>
<style>/* 家計管理ダッシュボード
   単一HTMLに埋め込まれる。外部フォント・CDNは一切使わない（オフラインで完全に動く） */

:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --plane: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --critical: #d03b3b;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04);
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #1a1a19;
    --plane: #0d0d0d;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --good-text: #0ca30c;
    --shadow: none;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --plane: #0d0d0d;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --baseline: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --good-text: #0ca30c;
  --shadow: none;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1160px; margin: 0 auto; padding: 32px 20px 80px; }

/* ---------------------------------------------------------------- header */

.page-head {
  display: flex; flex-wrap: wrap; gap: 16px;
  align-items: baseline; justify-content: space-between;
  margin-bottom: 20px;
}
.page-title { font-size: 20px; font-weight: 650; letter-spacing: .01em; margin: 0; }
.page-sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.theme-toggle {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 12px; cursor: pointer;
}
.theme-toggle:hover { color: var(--ink); }

/* ---------------------------------------------------------------- banner */

.banner {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--border); border-left: 3px solid var(--warning);
  background: var(--surface); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 20px; font-size: 13px;
}
.banner.is-critical { border-left-color: var(--critical); }
.banner-icon { flex: none; font-size: 15px; line-height: 1.4; }
.banner-body { color: var(--ink-2); }
.banner-body strong { color: var(--ink); font-weight: 600; }

/* ---------------------------------------------------------------- filters */

.filterbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin-bottom: 20px;
}
.filterbar-label { color: var(--muted); font-size: 12px; margin-right: 2px; }
.chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 5px 13px; font: inherit; font-size: 12.5px; cursor: pointer;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip:hover { color: var(--ink); border-color: var(--baseline); }
.chip[aria-pressed="true"] {
  background: var(--ink); color: var(--surface); border-color: var(--ink);
}
.chip .chip-mark { opacity: .55; margin-left: 5px; font-size: 11px; }

/* ---------------------------------------------------------------- layout */

/* align-items:start でカードが内容の高さに収まる（隣が長いだけで空白が伸びるのを防ぐ） */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); align-items: start; }
.card {
  grid-column: span 12;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 20px; box-shadow: var(--shadow);
  min-width: 0;
}
.card.span-8 { grid-column: span 8; }
.card.span-6 { grid-column: span 6; }
.card.span-4 { grid-column: span 4; }
@media (max-width: 880px) {
  .card.span-8, .card.span-6, .card.span-4 { grid-column: span 12; }
}

.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 14px; }
.card-title { font-size: 13px; font-weight: 620; margin: 0; letter-spacing: .02em; }
.card-note { color: var(--muted); font-size: 11.5px; }

/* ---------------------------------------------------------------- figures */

.hero-row { display: flex; flex-wrap: wrap; gap: 28px 40px; align-items: flex-end; }
.hero { min-width: 0; }
.hero-label { color: var(--muted); font-size: 12px; }
.hero-value { font-size: 48px; font-weight: 640; line-height: 1.1; letter-spacing: -.02em; }
.hero-value .unit { font-size: 20px; font-weight: 500; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
.hero-delta { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.hero-delta .up { color: var(--critical); }
.hero-delta .down { color: var(--good-text); }

.tiles { display: flex; flex-wrap: wrap; gap: 26px 36px; }
.tile { min-width: 0; }
.tile-label { color: var(--muted); font-size: 11.5px; }
.tile-value { font-size: 21px; font-weight: 620; line-height: 1.25; }
.tile-value .unit { font-size: 12px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.tile-sub { color: var(--muted); font-size: 11.5px; }

/* ---------------------------------------------------------------- charts */

.chart { width: 100%; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .lbl-value { fill: var(--ink); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart .lbl-cat { fill: var(--ink-2); font-size: 12px; }
.chart .baseline { stroke: var(--baseline); stroke-width: 1; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .bar { fill: var(--series-1); }
.chart .bar.is-dim { fill: var(--baseline); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover + .bar, .chart .bar:hover { filter: brightness(1.08); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; }
.legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); }
.legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.legend-swatch.hatched { background-image: repeating-linear-gradient(45deg, var(--baseline) 0 2px, transparent 2px 4px); border: 1px solid var(--baseline); }

/* ---------------------------------------------------------------- bar list */

.barlist { display: flex; flex-direction: column; gap: 9px; }
.barrow { display: grid; grid-template-columns: 116px 1fr auto; gap: 12px; align-items: center; }
.barrow-name { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barrow-track { height: 14px; position: relative; }
.barrow-fill {
  height: 14px; background: var(--series-1);
  border-radius: 0 4px 4px 0; min-width: 2px;
}
.barrow-val { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.barrow-pct { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: 6px; }
.barrow-subs { grid-column: 2 / -1; color: var(--muted); font-size: 11.5px; margin-top: -4px; }

/* --------------------------------------------------------- split (2 series) */

.split { display: flex; height: 22px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--surface); }
.split-seg { height: 22px; }
.split-seg.s1 { background: var(--series-1); border-radius: 4px 0 0 4px; }
.split-seg.s2 { background: var(--series-2); border-radius: 0 4px 4px 0; }

/* ---------------------------------------------------------------- tables */

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th {
  text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px;
  padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th .arrow { opacity: .5; font-size: 9px; margin-left: 3px; }
td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--ink-2); }
tbody tr:hover td { background: var(--plane); }
td.strong { color: var(--ink); font-weight: 600; }
tbody tr:last-child td { border-bottom: none; }

.tag {
  display: inline-block; padding: 1px 7px; border-radius: 4px;
  background: var(--plane); border: 1px solid var(--border);
  color: var(--ink-2); font-size: 11px; white-space: nowrap;
}
.tag.is-review { border-color: var(--warning); color: var(--ink); }
.tag.is-fixed { border-color: var(--series-3); }
.tag.is-refund { border-color: var(--good); }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex: none; }

/* ---------------------------------------------------------------- controls */

.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.input, .select {
  border: 1px solid var(--border); background: var(--plane); color: var(--ink);
  border-radius: 7px; padding: 6px 10px; font: inherit; font-size: 12.5px;
}
.input { min-width: 200px; flex: 1 1 200px; }
.input::placeholder { color: var(--muted); }
.input:focus, .select:focus { outline: 2px solid var(--series-1); outline-offset: -1px; }

.empty {
  color: var(--muted); font-size: 12.5px; padding: 18px 0; text-align: center;
  border: 1px dashed var(--border); border-radius: 8px;
}

.rowcount { color: var(--muted); font-size: 11.5px; margin-top: 10px; }

/* ---------------------------------------------------------------- tooltip */

#tip {
  position: fixed; z-index: 50; pointer-events: none; opacity: 0;
  transition: opacity .1s; background: var(--ink); color: var(--surface);
  border-radius: 6px; padding: 7px 10px; font-size: 12px; line-height: 1.45;
  white-space: nowrap; box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
}
#tip .t-val { font-weight: 650; font-variant-numeric: tabular-nums; }
#tip .t-sub { opacity: .72; font-size: 11px; }

/* ---------------------------------------------------------------- misc */

.hint { color: var(--muted); font-size: 11.5px; margin-top: 10px; }
.setup-note { color: var(--muted); font-size: 12px; }
.setup-note code { background: var(--plane); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 11.5px; }

@media print {
  .theme-toggle, .controls, .filterbar { display: none; }
  .card { break-inside: avoid; }
}
</style>
<style>
/* 合言葉の入力画面 */
.gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.gate-card {
  width: 100%; max-width: 380px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; padding: 28px 26px; box-shadow: var(--shadow);
}
.gate-title { font-size: 17px; font-weight: 650; margin: 0 0 6px; }
.gate-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 20px; line-height: 1.6; }
.gate-form { display: flex; flex-direction: column; gap: 12px; }
.gate-form input[type="password"] {
  border: 1px solid var(--border); background: var(--plane); color: var(--ink);
  border-radius: 8px; padding: 11px 13px; font: inherit; font-size: 15px; width: 100%;
}
.gate-form input[type="password"]:focus { outline: 2px solid var(--series-1); outline-offset: -1px; }
.gate-form button {
  background: var(--ink); color: var(--surface); border: none; border-radius: 8px;
  padding: 11px 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
}
.gate-form button:disabled { opacity: .55; cursor: default; }
.gate-remember { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12.5px; }
.gate-err { color: var(--critical); font-size: 12.5px; min-height: 1.2em; }
.gate-note { color: var(--muted); font-size: 11.5px; margin-top: 18px; line-height: 1.6; border-top: 1px solid var(--border); padding-top: 14px; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <h1 class="gate-title">家計管理ダッシュボード</h1>
    <p class="gate-sub">このページの内容は暗号化されています。合言葉を入力すると、お使いのブラウザの中だけで復号して表示します。</p>
    <form class="gate-form" id="gate-form">
      <input type="password" id="pass" placeholder="合言葉" autocomplete="current-password" autofocus>
      <label class="gate-remember">
        <input type="checkbox" id="remember" checked>
        このブラウザに記憶する（次回から自動で開く）
      </label>
      <div class="gate-err" id="gate-err"></div>
      <button type="submit" id="gate-btn">開く</button>
    </form>
    <p class="gate-note">合言葉はサーバーに送られません。暗号文の復号はすべてブラウザ内（Web Crypto API）で行われ、鍵は PBKDF2 で合言葉から導出されます。</p>
  </div>
</div>

<div class="wrap" id="app" hidden>

  <div class="page-head">
    <div>
      <h1 class="page-title">家計管理ダッシュボード</h1>
      <p class="page-sub" id="page-sub"></p>
    </div>
    <div style="display:flex; gap:8px">
      <button class="theme-toggle" id="theme" type="button">🌙 ダーク</button>
      <button class="theme-toggle" id="lock" type="button">🔒 ロック</button>
    </div>
  </div>

  <div id="banners"></div>
  <div class="filterbar" id="filters"></div>

  <div class="grid">
    <section class="card"><div class="hero-row" id="hero"></div></section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">月次支出の推移</h2>
        <span class="card-note">利用日ベース／棒をタップすると期間を切り替えます</span>
      </div>
      <div id="trend"></div>
    </section>

    <section class="card span-8">
      <div class="card-head">
        <h2 class="card-title">カテゴリ別支出</h2>
        <span class="card-note" id="cat-note"></span>
      </div>
      <div id="categories"></div>
    </section>

    <section class="card span-4">
      <div class="card-head"><h2 class="card-title">固定費と変動費</h2></div>
      <div id="fixedsplit"></div>
    </section>

    <section class="card span-6">
      <div class="card-head"><h2 class="card-title">献金（手取り基準）</h2></div>
      <div id="tithe"></div>
    </section>

    <section class="card span-6">
      <div class="card-head">
        <h2 class="card-title">要確認キュー</h2>
        <span class="card-note">分類が確定していない取引</span>
      </div>
      <div id="review"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">固定費一覧</h2>
        <span class="card-note" id="fixed-note"></span>
      </div>
      <div id="fixedlist"></div>
    </section>

    <section class="card span-6">
      <div class="card-head"><h2 class="card-title">口座残高</h2></div>
      <div id="accounts"></div>
    </section>

    <section class="card span-6">
      <div class="card-head"><h2 class="card-title">カード引落予定</h2></div>
      <div id="payments"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">店舗別 支出 TOP20</h2>
        <span class="card-note" id="mer-note"></span>
      </div>
      <div id="merchants"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">取引一覧</h2>
        <span class="card-note">見出しをタップで並べ替え</span>
      </div>
      <div class="controls">
        <input class="input" id="f-search" type="search" placeholder="店名・備考で検索" autocomplete="off">
        <select class="select" id="f-category"><option value="">すべてのカテゴリ</option></select>
      </div>
      <div id="txtable"></div>
    </section>
  </div>
</div>

const APP_SRC = "/**\n * 集計ロジック（Node の CLI とブラウザの両方から使う）。\n *\n * ★ 集計値はファイルに保存しない。カード明細は利用日と請求月がずれ、\n *   過去月の集計は後から変わり得るため、常に取引データから再計算する。\n *\n * build.js はこのファイルの中身から `export ` を落として HTML に埋め込む。\n * そのため、ここでは import を書かないこと（自己完結させる）。\n */\n\nfunction yenFmt(n) {\n  const v = Math.round(n ?? 0);\n  return (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('ja-JP');\n}\n\n/** 支出として集計する取引か（振替・カード引落は二重計上になるため除外） */\nfunction isSpending(t) {\n  return t.type === 'expense' || t.type === 'refund';\n}\n\n/** 利用日ベースの月別集計 */\nfunction monthlyTotals(transactions) {\n  const map = new Map();\n  for (const t of transactions) {\n    if (!isSpending(t)) continue;\n    const m = t.date.slice(0, 7);\n    const e = map.get(m) ?? { month: m, amount: 0, count: 0 };\n    e.amount += t.amount; e.count++;\n    map.set(m, e);\n  }\n  return [...map.values()].sort((a, b) => a.month.localeCompare(b.month));\n}\n\n/**\n * 「その月が明細でカバーされているか」を判定する。\n *\n * カード明細は締め日の関係で1ファイルに2ヶ月分の利用日が混在し、\n * 期間の両端の月は必ず一部しか含まれない。\n * 端の月をそのまま前月比に使うと誤った減少に見えるため、明示的に印を付ける。\n */\nfunction markIncompleteMonths(months, importLog, startMonth = null) {\n  if (months.length === 0) return months;\n\n  // 取り込んだ明細がカバーする利用日の範囲を求める\n  const froms = (importLog ?? []).map((e) => e.usage_from).filter(Boolean).sort();\n  const tos = (importLog ?? []).map((e) => e.usage_to).filter(Boolean).sort();\n  if (froms.length === 0 || tos.length === 0) {\n    // 旧形式の import_log（範囲情報なし）へのフォールバック\n    const first = months[0].month, last = months[months.length - 1].month;\n    return months.map((m) => ({ ...m, incomplete: m.month === first || m.month === last }));\n  }\n\n  // 意図的に切り捨てた期間より前は「範囲外」であって「不完全」ではない\n  let coveredFrom = froms[0];\n  if (startMonth && coveredFrom < `${startMonth}-01`) coveredFrom = `${startMonth}-01`;\n  const coveredTo = tos[tos.length - 1];\n\n  return months.map((m) => {\n    const monthStart = `${m.month}-01`;\n    const monthEnd = `${m.month}-${String(daysInMonth(m.month)).padStart(2, '0')}`;\n    return { ...m, incomplete: monthStart < coveredFrom || monthEnd > coveredTo };\n  });\n}\n\nfunction daysInMonth(month) {\n  const [y, m] = month.split('-').map(Number);\n  return new Date(y, m, 0).getDate();\n}\n\n/** カテゴリ別集計（金額降順） */\nfunction byCategory(transactions, month = null) {\n  const map = new Map();\n  for (const t of transactions) {\n    if (!isSpending(t)) continue;\n    if (month && t.date.slice(0, 7) !== month) continue;\n    const e = map.get(t.category) ?? { category: t.category, amount: 0, count: 0, subs: new Map() };\n    e.amount += t.amount; e.count++;\n    const sk = t.subcategory ?? '—';\n    e.subs.set(sk, (e.subs.get(sk) ?? 0) + t.amount);\n    map.set(t.category, e);\n  }\n  const list = [...map.values()].map((e) => ({\n    ...e,\n    subs: [...e.subs.entries()].map(([name, amount]) => ({ name, amount })).sort((a, b) => b.amount - a.amount),\n  }));\n  return list.sort((a, b) => b.amount - a.amount);\n}\n\n/** 店舗別集計（表示名でまとめる） */\nfunction byMerchant(transactions, month = null) {\n  const map = new Map();\n  for (const t of transactions) {\n    if (!isSpending(t)) continue;\n    if (month && t.date.slice(0, 7) !== month) continue;\n    const k = t.merchant || t.merchant_key;\n    const e = map.get(k) ?? { merchant: k, amount: 0, count: 0, category: t.category };\n    e.amount += t.amount; e.count++;\n    map.set(k, e);\n  }\n  return [...map.values()].sort((a, b) => b.amount - a.amount);\n}\n\n/** 固定費と変動費の比率 */\nfunction fixedVsVariable(transactions, month = null) {\n  let fixed = 0, variable = 0;\n  for (const t of transactions) {\n    if (!isSpending(t)) continue;\n    if (month && t.date.slice(0, 7) !== month) continue;\n    if (t.is_fixed_cost) fixed += t.amount; else variable += t.amount;\n  }\n  return { fixed, variable, total: fixed + variable };\n}\n\n// ------------------------------------------------------------------ 献金\n\n/** 端数処理（金額は必ず整数円で扱う） */\nfunction roundTithe(value, rounding = 'ceil', unit = 100) {\n  const u = unit > 0 ? unit : 1;\n  const q = value / u;\n  const r = rounding === 'floor' ? Math.floor(q) : rounding === 'round' ? Math.round(q) : Math.ceil(q);\n  return r * u;\n}\n\n/**\n * 月ごとの献金額を計算する。\n * 対象は is_tithe_target の収入の net_amount（手取り基準）。\n * add_back_savings_deduction が true なら天引き積立を対象に戻す。\n */\nfunction titheByMonth(incomes, titheRecords, config, transactions = []) {\n  const cfg = config?.tithe ?? {};\n  const rate = cfg.rate ?? 0.1;\n  const addBack = cfg.add_back_savings_deduction === true;\n\n  const map = new Map();\n  for (const inc of incomes ?? []) {\n    if (inc.is_tithe_target === false) continue;\n    const m = inc.date.slice(0, 7);\n    const e = map.get(m) ?? { month: m, base: 0, sources: [] };\n    const base = (inc.net_amount ?? 0) + (addBack ? (inc.savings_deduction ?? 0) : 0);\n    e.base += base;\n    e.sources.push({ name: inc.name, amount: base });\n    map.set(m, e);\n  }\n\n  // 献金済みの額は「什一献金の支出取引」から数える。\n  // 献金は支出としても計上されるため（仕様書7.5）、ここを別管理にすると\n  // 「支出には出ているのに未献金と表示される」という矛盾が起きる。\n  // tithe.json に記録がある月は、そちらを正として上書きする。\n  const paidByMonth = new Map();\n  for (const t of transactions ?? []) {\n    if (t.category !== '献金' || t.subcategory !== '什一献金') continue;\n    const m = t.date.slice(0, 7);\n    paidByMonth.set(m, (paidByMonth.get(m) ?? 0) + t.amount);\n  }\n  for (const rec of titheRecords ?? []) {\n    paidByMonth.set(rec.month, rec.paid_amount ?? 0);\n  }\n\n  const months = [...new Set([...map.keys(), ...paidByMonth.keys()])].sort();\n  let carry = 0;\n  return months.map((m) => {\n    const e = map.get(m) ?? { month: m, base: 0, sources: [] };\n    const calculated = roundTithe(e.base * rate, cfg.rounding ?? 'ceil', cfg.rounding_unit ?? 100);\n    const paid = paidByMonth.get(m) ?? 0;\n    carry += calculated - paid;\n    return { month: m, base: e.base, sources: e.sources, rate, calculated, paid, remaining: calculated - paid, carryOver: carry };\n  });\n}\n\n// ------------------------------------------------------------------ 口座\n\n/**\n * 理論残高を計算する。\n * 直近のスナップショット以降の収入・支出・振替を積み上げる。\n * データが未登録なら null を返し、UI 側は「未設定」を表示する。\n */\nfunction accountBalances(accounts, balances, incomes, transactions) {\n  if (!accounts || accounts.length === 0) return [];\n  return accounts.map((acc) => {\n    const snaps = (balances ?? [])\n      .filter((b) => b.account_id === acc.id)\n      .sort((a, b) => a.date.localeCompare(b.date));\n    const latest = snaps[snaps.length - 1] ?? null;\n    if (!latest) return { ...acc, actual: null, calculated: null, diff: null, asOf: null };\n\n    let calc = latest.actual_balance;\n    for (const inc of incomes ?? []) {\n      if (inc.deposit_account_id === acc.id && inc.date > latest.date) calc += inc.net_amount ?? 0;\n    }\n    for (const t of transactions ?? []) {\n      if (t.date <= latest.date) continue;\n      if (t.type === 'transfer') {\n        if (t.from_account_id === acc.id) calc -= t.amount;\n        if (t.to_account_id === acc.id) calc += t.amount;\n      } else if (t.settlement_account_id === acc.id || (t.account_id === acc.id && t.source !== 'card')) {\n        calc -= t.amount;\n      }\n    }\n    return {\n      ...acc,\n      actual: latest.actual_balance,\n      calculated: calc,\n      diff: latest.actual_balance - calc,\n      asOf: latest.date,\n    };\n  });\n}\n\n/** 未払いのカード請求（引落予定） */\nfunction upcomingPayments(importLog, today) {\n  const t = today ?? new Date().toISOString().slice(0, 10);\n  return (importLog ?? [])\n    .filter((e) => e.payment_date)\n    .map((e) => ({\n      date: e.payment_date,\n      label: `イオンゴールド ${e.billing_month} 請求分`,\n      amount: e.billed,\n      past: e.payment_date < t,\n    }))\n    .sort((a, b) => a.date.localeCompare(b.date));\n}\n\n/**\n * 固定費マスタの一覧。\n * 生成される固定費は取引から実績を、CSVに実額が出る固定費は\n * match_pattern に一致した取引から実績を集計する。\n */\nfunction fixedCostList(fixedCosts, transactions, months) {\n  const nMonths = Math.max(1, (months ?? []).length);\n  return (fixedCosts ?? []).map((fc) => {\n    let items;\n    if (fc.auto_generate) {\n      items = (transactions ?? []).filter((t) => t.fixed_cost_id === fc.id);\n    } else if (fc.match_pattern) {\n      const re = new RegExp(fc.match_pattern, 'i');\n      items = (transactions ?? []).filter((t) => re.test(t.merchant_key ?? ''));\n    } else {\n      // マスタ上の括りだけで、対応する取引を一意に決められないもの\n      items = (transactions ?? []).filter(\n        (t) => t.is_fixed_cost && t.category === fc.category && t.subcategory === fc.subcategory && t.source === 'card',\n      );\n    }\n    const actualTotal = items.reduce((a, t) => a + t.amount, 0);\n    const monthsSeen = new Set(items.map((t) => t.date.slice(0, 7))).size;\n    return {\n      ...fc,\n      generated: fc.auto_generate === true,\n      count: items.length,\n      monthsSeen,\n      actualTotal,\n      // 月平均：実績のある月で割る（隔月請求の水道などを月額に均さないため）\n      actualAvg: monthsSeen > 0 ? Math.round(actualTotal / monthsSeen) : null,\n      monthlyEquivalent: actualTotal / nMonths,\n      unset: fc.amount === null && fc.amount_type !== 'computed' && items.length === 0,\n    };\n  }).sort((a, b) => b.actualTotal - a.actualTotal);\n}\n\n/** 要確認キュー（金額の大きい順にまとめる） */\nfunction reviewQueue(transactions) {\n  const map = new Map();\n  for (const t of transactions) {\n    if (!t.needs_review) continue;\n    const k = t.merchant_key;\n    const e = map.get(k) ?? { key: k, merchant: t.merchant, amount: 0, count: 0, items: [] };\n    e.amount += t.amount; e.count++; e.items.push(t);\n    map.set(k, e);\n  }\n  return [...map.values()].sort((a, b) => b.amount - a.amount);\n}\n\n/* ダッシュボード描画。\n   DATA は build.js が埋め込むオブジェクト。summary.js の関数は同じスコープに展開されている。\n   グラフは外部ライブラリを使わず SVG を直接組み立てる（オフラインで確実に描画するため）。 */\n\nconst $ = (sel) => document.querySelector(sel);\nconst el = (tag, attrs = {}, children = []) => {\n  const node = document.createElementNS(\n    tag === 'svg' || SVG_TAGS.has(tag) ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml',\n    tag,\n  );\n  for (const [k, v] of Object.entries(attrs)) {\n    if (v === null || v === undefined || v === false) continue;\n    if (k === 'text') node.textContent = v;\n    else if (k === 'html') node.innerHTML = v;\n    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);\n    else node.setAttribute(k, String(v));\n  }\n  for (const c of [].concat(children)) if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);\n  return node;\n};\nconst SVG_TAGS = new Set(['g', 'rect', 'text', 'line', 'path', 'circle', 'defs', 'pattern', 'tspan']);\n\n/** HTML文字列に差し込むデータは必ずこれを通す（店名や備考はCSV由来で内容を保証できない） */\nconst esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => (\n  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]\n));\n\nconst TX = DATA.transactions;\nconst state = {\n  month: null,          // null = 全期間\n  search: '',\n  category: '',\n  sort: { key: 'date', dir: 'desc' },\n};\n\n// ------------------------------------------------------------------ tooltip\n\nconst tip = $('#tip');\nfunction showTip(evt, html) {\n  tip.innerHTML = html;\n  tip.style.opacity = '1';\n  moveTip(evt);\n}\nfunction moveTip(evt) {\n  const pad = 14;\n  const r = tip.getBoundingClientRect();\n  let x = evt.clientX + pad;\n  let y = evt.clientY - r.height - 8;\n  if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - pad;\n  if (y < 8) y = evt.clientY + pad;\n  tip.style.left = x + 'px';\n  tip.style.top = y + 'px';\n}\nfunction hideTip() { tip.style.opacity = '0'; }\n\n// ------------------------------------------------------------------ 派生データ\n\nconst months = markIncompleteMonths(monthlyTotals(TX), DATA.importLog, DATA.config?.analysis?.start_month);\nconst titheRows = titheByMonth(DATA.incomes, DATA.tithe, DATA.config, TX);\nconst payments = upcomingPayments(DATA.importLog, DATA.today);\nconst reviews = reviewQueue(TX);\nconst mismatches = (DATA.importLog ?? []).filter((e) => e.status === 'MISMATCH');\n\n// 既定の表示月：明細で完全にカバーされている最後の月\nconst completeMonths = months.filter((m) => !m.incomplete);\nstate.month = completeMonths.length ? completeMonths[completeMonths.length - 1].month : null;\n\nconst scoped = () => (state.month ? TX.filter((t) => t.date.slice(0, 7) === state.month) : TX);\n\n// ------------------------------------------------------------------ 描画\n\nfunction render() {\n  renderBanner();\n  renderFilterBar();\n  renderHero();\n  renderTrend();\n  renderCategories();\n  renderFixedSplit();\n  renderTithe();\n  renderFixedList();\n  renderReview();\n  renderMerchants();\n  renderAccounts();\n  renderPayments();\n  renderTable();\n}\n\nfunction renderBanner() {\n  const host = $('#banners');\n  host.replaceChildren();\n  if (mismatches.length > 0) {\n    host.appendChild(el('div', { class: 'banner is-critical' }, [\n      el('span', { class: 'banner-icon', text: '⚠' }),\n      el('div', {\n        class: 'banner-body',\n        html: '<strong>検算不一致</strong>：' + mismatches\n          .map((e) => `${esc(e.billing_month)} 請求分（請求 ${yenFmt(e.billed)}円 / 明細 ${yenFmt(e.detail_sum)}円 / 差 ${yenFmt(e.diff)}円）`)\n          .join('、') + ' — 取り込みは継続しています。',\n      }),\n    ]));\n  }\n  if (reviews.length > 0) {\n    const total = reviews.reduce((a, r) => a + r.amount, 0);\n    host.appendChild(el('div', { class: 'banner' }, [\n      el('span', { class: 'banner-icon', text: '?' }),\n      el('div', {\n        class: 'banner-body',\n        html: `<strong>要確認 ${reviews.length}件（${yenFmt(total)}円）</strong> — 分類が確定していない取引があります。`\n          + ' <code>data/category_rules.json</code> にルールを追記して <code>npm run review -- --all</code> で反映されます。',\n      }),\n    ]));\n  }\n}\n\nfunction renderFilterBar() {\n  const host = $('#filters');\n  host.replaceChildren(el('span', { class: 'filterbar-label', text: '対象期間' }));\n  host.appendChild(el('button', {\n    class: 'chip', type: 'button', 'aria-pressed': state.month === null,\n    onclick: () => { state.month = null; render(); },\n  }, ['全期間']));\n  for (const m of months) {\n    host.appendChild(el('button', {\n      class: 'chip', type: 'button', 'aria-pressed': state.month === m.month,\n      title: m.incomplete ? 'カード明細の範囲外の日があり、この月は不完全です' : '',\n      onclick: () => { state.month = m.month; render(); },\n    }, [m.month, m.incomplete ? el('span', { class: 'chip-mark', text: '不完全' }) : null]));\n  }\n}\n\nfunction renderHero() {\n  const rows = scoped().filter(isSpending);\n  const total = rows.reduce((a, t) => a + t.amount, 0);\n  const label = state.month ? `${state.month} の支出` : '全期間の支出';\n\n  // 前月比（全期間表示のときと不完全月は出さない）\n  let delta = null;\n  if (state.month) {\n    const idx = months.findIndex((m) => m.month === state.month);\n    const cur = months[idx], prev = months[idx - 1];\n    if (cur && prev && !cur.incomplete && !prev.incomplete) {\n      const d = cur.amount - prev.amount;\n      const pct = prev.amount ? (d / prev.amount) * 100 : 0;\n      delta = { d, pct, prev: prev.month };\n    }\n  }\n\n  const income = state.month\n    ? (DATA.incomes ?? []).filter((i) => i.date.slice(0, 7) === state.month).reduce((a, i) => a + (i.net_amount ?? 0), 0)\n    : (DATA.incomes ?? []).reduce((a, i) => a + (i.net_amount ?? 0), 0);\n\n  const t = titheRows.length ? titheRows[titheRows.length - 1] : null;\n\n  $('#hero').replaceChildren(\n    el('div', { class: 'hero' }, [\n      el('div', { class: 'hero-label', text: label }),\n      el('div', { class: 'hero-value', html: yenFmt(total) + '<span class=\"unit\">円</span>' }),\n      delta\n        ? el('div', {\n            class: 'hero-delta',\n            html: `前月比 <span class=\"${delta.d >= 0 ? 'up' : 'down'}\">${delta.d >= 0 ? '+' : '−'}${yenFmt(Math.abs(delta.d))}円（${delta.d >= 0 ? '+' : '−'}${Math.abs(delta.pct).toFixed(1)}%）</span> vs ${delta.prev}`,\n          })\n        : el('div', { class: 'hero-delta', text: `${rows.length}件の取引` }),\n    ]),\n    el('div', { class: 'tiles' }, [\n      tile('取引件数', String(rows.length), '件'),\n      tile('手取り収入', yenFmt(income), '円', state.month ? '給与明細より' : `${(DATA.incomes ?? []).length}ヶ月分`),\n      income > 0 ? tile('収支', yenFmt(income - total), '円', income - total >= 0 ? '黒字' : '赤字') : null,\n      t ? tile('累積未献金', yenFmt(t.carryOver), '円', `${t.month} 時点`) : null,\n      tile('要確認', String(reviews.length), '件', reviews.length === 0 ? 'なし' : '分類が未確定'),\n    ].filter(Boolean)),\n  );\n}\n\nfunction tile(label, value, unit, sub) {\n  return el('div', { class: 'tile' }, [\n    el('div', { class: 'tile-label', text: label }),\n    el('div', { class: 'tile-value', html: value + (unit ? `<span class=\"unit\">${unit}</span>` : '') }),\n    sub ? el('div', { class: 'tile-sub', text: sub }) : null,\n  ]);\n}\n\n/** 月次推移（縦棒・単一系列）。値をすべてキャップに直接ラベルするのでy軸目盛りは置かない。 */\nfunction renderTrend() {\n  const host = $('#trend');\n  host.replaceChildren();\n  if (months.length === 0) { host.appendChild(el('div', { class: 'empty', text: 'データがありません' })); return; }\n\n  const W = 860, H = 240, padL = 8, padR = 8, padT = 34, padB = 44;\n  const innerW = W - padL - padR, innerH = H - padT - padB;\n  const max = Math.max(...months.map((m) => m.amount), 1);\n  const band = innerW / months.length;\n  const barW = Math.min(24, band * 0.5);\n\n  const svg = el('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMid meet', role: 'img' });\n  svg.appendChild(el('defs', {}, [\n    el('pattern', { id: 'hatch', width: 6, height: 6, patternTransform: 'rotate(45)', patternUnits: 'userSpaceOnUse' }, [\n      el('rect', { width: 6, height: 6, fill: 'var(--surface)' }),\n      el('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: 'var(--baseline)', 'stroke-width': 3 }),\n    ]),\n  ]));\n\n  months.forEach((m, i) => {\n    const h = Math.max(2, (m.amount / max) * innerH);\n    const x = padL + band * i + (band - barW) / 2;\n    const y = padT + innerH - h;\n    const selected = state.month === m.month;\n\n    // 4px の角丸データ端・ベースライン側は角なし\n    const r = Math.min(4, h);\n    const d = `M${x},${padT + innerH} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + barW - r},${y} Q${x + barW},${y} ${x + barW},${y + r} L${x + barW},${padT + innerH} Z`;\n    svg.appendChild(el('path', {\n      d, fill: m.incomplete ? 'url(#hatch)' : 'var(--series-1)',\n      opacity: selected || state.month === null ? 1 : 0.42,\n    }));\n\n    svg.appendChild(el('text', {\n      class: 'lbl-value', x: x + barW / 2, y: y - 8, 'text-anchor': 'middle', text: yenFmt(m.amount),\n    }));\n    svg.appendChild(el('text', {\n      x: padL + band * i + band / 2, y: padT + innerH + 17, 'text-anchor': 'middle',\n      text: m.month.slice(5) + '月', fill: selected ? 'var(--ink)' : undefined,\n    }));\n    if (m.incomplete) {\n      svg.appendChild(el('text', { x: padL + band * i + band / 2, y: padT + innerH + 32, 'text-anchor': 'middle', 'font-size': 10, text: '不完全' }));\n    }\n\n    const hit = el('rect', {\n      class: 'hit', x: padL + band * i, y: padT, width: band, height: innerH,\n      onmousemove: (e) => showTip(e, `<div class=\"t-val\">${yenFmt(m.amount)}円</div><div class=\"t-sub\">${esc(m.month)}・${m.count}件${m.incomplete ? '・明細範囲外あり' : ''}</div>`),\n      onmouseleave: hideTip,\n      onclick: () => { state.month = state.month === m.month ? null : m.month; render(); },\n    });\n    hit.style.cursor = 'pointer';\n    svg.appendChild(hit);\n  });\n\n  svg.appendChild(el('line', { class: 'baseline', x1: padL, y1: padT + innerH, x2: W - padR, y2: padT + innerH }));\n  host.appendChild(svg);\n  host.appendChild(el('div', { class: 'legend' }, [\n    el('span', { class: 'legend-item' }, [el('span', { class: 'legend-swatch', style: 'background: var(--series-1)' }), '支出（利用日ベース）']),\n    el('span', { class: 'legend-item' }, [el('span', { class: 'legend-swatch hatched' }), '不完全な月（カード明細の範囲外の日がある）']),\n  ]));\n}\n\n/** カテゴリ別（横棒・単一色のランキング）。値と構成比を直接ラベルする＝表を兼ねる。 */\nfunction renderCategories() {\n  const host = $('#categories');\n  const cats = byCategory(TX, state.month);\n  const total = cats.reduce((a, c) => a + c.amount, 0);\n  host.replaceChildren();\n  if const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

/* ------------------------------------------------------------------ 鍵の保管
 *
 * ★ 合言葉そのものは保存しない。
 *   GitHub Pages は https://<ユーザー名>.github.io という単一オリジンで、
 *   そのアカウントの全リポジトリの Pages が localStorage を共有する。
 *   合言葉を平文で置くと、別の Pages を1つ公開しただけでそこから読めてしまい、
 *   合言葉を使い回していれば被害がこのアプリの外へ広がる。
 *
 *   代わりに、PBKDF2 で導出した鍵を extractable: false のまま IndexedDB に置く。
 *   この鍵は「このブラウザでこのファイルを復号する」ことしかできず、
 *   JS から鍵素材を取り出せない。ロック解除時に削除できる。
 *   副次効果として、再訪時に PBKDF2 60万回を省けるので体感も速くなる。
 */
const DB_NAME = 'kakei', STORE = 'keys', KEY_ID = 'dek';

function idb(mode, run) {
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(DB_NAME, 1); } catch (e) { return reject(e); }
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction(STORE, mode);
      const out = run(tx.objectStore(STORE));
      tx.oncomplete = () => { db.close(); resolve(out ? out.result : undefined); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    };
  });
}
const saveKey  = (k) => idb('readwrite', (os) => os.put(k, KEY_ID));
const loadKey  = ()  => idb('readonly',  (os) => os.get(KEY_ID));
const clearKey = ()  => idb('readwrite', (os) => os.delete(KEY_ID));

async function deriveKey(passphrase) {
  const baseKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey'],
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,            // ★ extractable: false — 鍵素材を JS から取り出せない
    ['decrypt'],
  );
}

async function decryptWith(key) {
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data),
  );
  return new TextDecoder().decode(plain);
}

/* ------------------------------------------------------------------ 起動 */

const form = document.getElementById('gate-form');
const err = document.getElementById('gate-err');
const btn = document.getElementById('gate-btn');

/**
 * 復号したデータで描画する。
 * ★ gate は「描画が成功してから」消す。先に消すと、注入したスクリプトが
 *   失敗したときに空の枠だけが残り、リロードしても保存鍵で自動復号 →
 *   同じ場所で失敗、という白画面の無限ループになる。
 */
function boot(json) {
  const app = document.getElementById('app');
  const gate = document.getElementById('gate');
  app.hidden = false;
  try {
    const s = document.createElement('script');
    // sourceURL を付けないと、巨大な DATA の行に全エラーが潰れて原因が追えない
    s.textContent = 'const DATA = ' + json + ';\n' + APP_SRC + '\n//# sourceURL=kakei-app.js';
    document.body.appendChild(s);
    if (!window.__kakeiRendered) throw new Error('描画処理が完了しませんでした');

    // 注入側は `const DATA = ...`。classic script の top-level const は
    // グローバル**レキシカル**環境に入るため window のプロパティにはならない。
    // window.DATA ではなく、素の DATA を参照する。
    const sub = (typeof DATA !== 'undefined' && DATA && DATA.subtitle) || '';
    if (sub) document.getElementById('page-sub').textContent = sub;

    gate.remove();
    document.getElementById('lock').addEventListener('click', async () => {
      try { await clearKey(); } catch {}
      location.reload();
    });
  } catch (e) {
    app.hidden = true;
    err.textContent = '表示に失敗しました: ' + (e && e.message ? e.message : e);
    btn.disabled = false;
    btn.textContent = '開く';
    throw e;
  }
}

async function unlockWithKey(key, remember) {
  const json = await decryptWith(key);       // 合言葉が違えば AES-GCM がここで失敗する
  if (remember) { try { await saveKey(key); } catch {} }
  boot(json);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pass = document.getElementById('pass').value;
  if (!pass) return;
  btn.disabled = true;
  btn.textContent = '復号中…';
  err.textContent = '';
  try {
    const key = await deriveKey(pass);
    await unlockWithKey(key, document.getElementById('remember').checked);
  } catch {
    btn.disabled = false;
    btn.textContent = '開く';
    err.textContent = '合言葉が違います。';
    document.getElementById('pass').select();
  }
});

// 鍵が保存済みなら自動で開く。
// ※ 合言葉を変えた場合は復号に失敗するので、鍵を捨てて通常の入力に戻す。
(async () => {
  let key = null;
  try { key = await loadKey(); } catch {}
  if (!key) return;
  try {
    await unlockWithKey(key, false);
  } catch {
    try { await clearKey(); } catch {}
    btn.disabled = false;
    btn.textContent = '開く';
  }
})();

// テーマは復号前から効かせる
(() => {
  let saved = null;
  try { saved = localStorage.getItem('kakei-theme'); } catch {}
  const mode = saved ?? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', mode);
})();
</script>
