<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>家計管理ダッシュボード</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<div class="wrap">

  <div class="page-head">
    <div>
      <h1 class="page-title">家計管理ダッシュボード</h1>
      <p class="page-sub" id="page-sub"></p>
    </div>
    <button class="theme-toggle" id="theme" type="button">🌙 ダーク</button>
  </div>

  <div id="banners"></div>
  <div class="filterbar" id="filters"></div>

  <div class="grid">

    <section class="card">
      <div class="hero-row" id="hero"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">月次支出の推移</h2>
        <span class="card-note">利用日ベース／棒をクリックすると期間を切り替えます</span>
      </div>
      <div id="trend"></div>
    </section>

    <section class="card span-8">
      <div class="card-head">
        <h2 class="card-title">カテゴリ別支出</h2>
        <span class="card-note" id="cat-note"></span>
      </div>
      <div id="categories"></div>
    </section>

    <section class="card span-4">
      <div class="card-head">
        <h2 class="card-title">固定費と変動費</h2>
      </div>
      <div id="fixedsplit"></div>
    </section>

    <section class="card span-6">
      <div class="card-head">
        <h2 class="card-title">献金（手取り基準）</h2>
        <span class="card-note">全期間</span>
      </div>
      <div id="tithe"></div>
    </section>

    <section class="card span-6">
      <div class="card-head">
        <h2 class="card-title">要確認キュー</h2>
        <span class="card-note">分類が確定していない取引</span>
      </div>
      <div id="review"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">固定費一覧</h2>
        <span class="card-note" id="fixed-note"></span>
      </div>
      <div id="fixedlist"></div>
    </section>

    <section class="card span-6">
      <div class="card-head">
        <h2 class="card-title">口座残高</h2>
        <span class="card-note">最新スナップショット</span>
      </div>
      <div id="accounts"></div>
    </section>

    <section class="card span-6">
      <div class="card-head">
        <h2 class="card-title">カード引落予定</h2>
        <span class="card-note">全期間</span>
      </div>
      <div id="payments"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">店舗別 支出 TOP20</h2>
        <span class="card-note" id="mer-note"></span>
      </div>
      <div id="merchants"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">取引一覧</h2>
        <span class="card-note">見出しをクリックで並べ替え</span>
      </div>
      <div class="controls">
        <input class="input" id="f-search" type="search" placeholder="店名・備考で検索" autocomplete="off">
        <select class="select" id="f-category"><option value="">すべてのカテゴリ</option></select>
      </div>
      <div id="txtable"></div>
    </section>

  </div>
</div>

<div id="tip" role="status" aria-live="polite"></div>

<script>const DATA = /*__DATA__*/null;</script>
<!-- type="module" は使わない。file:// で開いたときにモジュール扱いで弾かれる環境を避けるため、
     build.js が summary.js の export を落として素のスクリプトとして展開する。 -->
<script>
/*__SUMMARY__*/
/*__APP__*/
</script>
</body>
</html>
